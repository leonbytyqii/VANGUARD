[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# E/F/W: pycodestyle errors/warnings + pyflakes (the universal baseline)
# I: import sorting (enforces isort-compatible ordering)
# E501 excluded: existing codebase has not enforced line length; add a
# formatter pass before re-enabling.
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Alembic auto-generated migration files use the boilerplate Union/Sequence
# imports that pre-date PEP 604 / 3.9+ stdlib moves; leave them alone.
"alembic/versions/*.py" = ["I001", "F401"]
"alembic/env.py" = ["I001"]
