[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# E/F/W: pycodestyle errors/warnings + pyflakes (the universal baseline)
# I: import sorting (enforces isort-compatible ordering)
# E501 excluded: existing codebase has not enforced line length; add a
# formatter pass before re-enabling.
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Alembic auto-generated migration files use the boilerplate Union/Sequence
# imports that pre-date PEP 604 / 3.9+ stdlib moves; leave them alone.
"alembic/versions/*.py" = ["I001", "F401"]
"alembic/env.py" = ["I001"]

[tool.pytest.ini_options]
# Point pytest at the tests directory so it does not scan app/ or alembic/.
testpaths = ["tests"]
# pytest-asyncio 0.24+ requires asyncio_mode and asyncio_default_fixture_loop_scope
# to be set explicitly or it raises a UsageError (exit code 4).  We have no async
# tests today; "auto" is the least-surprising mode if any are added later.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
