services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-socai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-socai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      DETECTIONS_PATH: /detections
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./detections:/detections:ro

  # Background worker for detection execution and agentic investigations.
  # Introduced from Phase 4 onward (app.worker.celery_app); disabled by
  # default via the `jobs` profile until that module exists, so a plain
  # `docker compose up` on an earlier phase doesn't crash-loop it.
  worker:
    build:
      context: ./backend
    restart: unless-stopped
    profiles: ["jobs"]
    command: celery -A app.worker.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      DETECTIONS_PATH: /detections
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./detections:/detections:ro

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-SOC-AI}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
