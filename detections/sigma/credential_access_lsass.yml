title: Potential LSASS Memory Dump via Command-Line Tooling
id: sigma_credential_access_lsass
status: stable
description: >
  Detects command lines referencing both a known dumping utility
  (procdump, rundll32+comsvcs.dll, taskmgr-style dumps) and the LSASS
  process by name — the standard "dump LSASS to steal credentials"
  pattern (Mimikatz-adjacent tradecraft), rather than requiring a
  specific tool name so slight tooling variations still match.
level: critical
logsource:
  category: process_creation
  product: windows
detection:
  selection_tool:
    CommandLine|contains:
      - 'procdump'
      - 'comsvcs.dll'
      - 'MiniDump'
  selection_target:
    CommandLine|contains: 'lsass'
  condition: selection_tool and selection_target
tags:
  - attack.credential_access
  - attack.t1003.001
